[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polypesto"
version = "0.1.0"
description = "PolyPESTO: Polymerization parameter estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Your Name"}]

dependencies = [
  "pypesto[amici,petab,fides]<0.6.0",
  "python-libsbml>=5.17.0",
  "h5py",
  "SBMLDiagrams",
  "plotly",
  "pyswarm",
  "streamlit",
  "cmake",
  "matplotlib",
  "seaborn",
  "jupyter",
  "ipykernel",
  "pytest",
  "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["polypesto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (parameter estimation, MCMC)",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
polypesto = { path = ".", editable = true }

[tool.pixi.tasks]
app = "streamlit run polypesto/app/home.py"

[tool.pixi.dependencies]
python = "3.11.*"
hdf5 = "*"
libblas = "*"
liblapack = "*"
swig = "*"
cxx-compiler = "*"    # cross-platform g++/clang++/msvc
cmake = "*"